name: Scan offers and publish report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan-and-publish.yml'
      - 'config.top10.json'
      - 'domradar/**'
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: domradar-scan-and-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Scan configured searches
        run: python -m domradar once --config config.top10.json --data data
      - name: Require a useful scan
        run: |
          python - <<'PY'
          import json
          import sqlite3
          cfg = json.load(open('config.top10.json', encoding='utf-8'))
          enabled = [source for source in cfg['sources'] if source.get('enabled')]
          expected = sum(len(source['search_urls']) for source in enabled)
          db = sqlite3.connect('data/domradar.sqlite3')
          latest = db.execute('''SELECT source, status, parsed FROM scans
                                 ORDER BY at DESC LIMIT ?''', (expected,)).fetchall()
          working = sum(status != 'error' and parsed > 0 for _, status, parsed in latest)
          by_source = {source['id']: 0 for source in enabled}
          for source, status, parsed in latest:
              by_source[source] = by_source.get(source, 0) + int(status != 'error' and parsed > 0)
          if len(latest) != expected or working == 0 or any(count == 0 for count in by_source.values()):
              raise SystemExit(f'Scan failed: {working}/{len(latest)} working searches; sources={by_source}')
          print(f'Working city searches: {working}/{expected}; sources={by_source}')
          PY
      - name: Persist scan state for the next run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/domradar.sqlite3
          if ! git diff --cached --quiet; then
            git commit -m 'chore: save DomRadar scan state'
            git push
          fi
      - name: Prepare public report
        run: |
          mkdir -p site
          cp data/raport.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
