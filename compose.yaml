services:
  monitor:
    build: .
    restart: unless-stopped
    environment:
      TZ: Europe/Warsaw
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      - ./config.json:/config/config.json:ro
      - ./data:/data
  web:
    image: caddy:2.10-alpine
    profiles: [web]
    restart: unless-stopped
    environment:
      DOMRADAR_DOMAIN: ${DOMRADAR_DOMAIN:-localhost}
      DOMRADAR_USER: ${DOMRADAR_USER:-}
      DOMRADAR_PASSWORD_HASH: ${DOMRADAR_PASSWORD_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/srv/report:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
